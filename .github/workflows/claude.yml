# Optional: enables @claude mentions in issues/PR comments to trigger Claude Code.
# Dormant until a repo admin adds the ANTHROPIC_API_KEY secret (Settings > Secrets
# and variables > Actions) and, if using a custom GitHub App, APP_ID/APP_PRIVATE_KEY.
# See https://code.claude.com/docs/en/github-actions
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
